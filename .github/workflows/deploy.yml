name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Spaces
        run: |
          git remote add huggingface https://user:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/nilayss/insight-ai-backend
          git push huggingface main --force

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd frontend && npm install --legacy-peer-deps && npm run build
      # Vercel handles actual deployment via CLI
